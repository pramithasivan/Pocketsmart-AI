{% extends "base.html" %}
{% block title %}Sign In - PocketSmart{% endblock %}
{% block content %}
<div class="planner-container" style="max-width:440px; margin-top:3.5rem;">
  <div class="planner-header">
    <h2>Welcome Back</h2>
    <p>Sign in to access your budget assistant and history</p>
  </div>
  <div class="form-body">
    {% if error %}
      <div style="background:#fee2e2; border:1px solid #ef4444; color:#b91c1c; padding:0.75rem; border-radius:6px; margin-bottom:1rem; font-size:0.9rem;">
        {{ error }}
      </div>
    {% endif %}
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username"><i class="fa-solid fa-user"></i> Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Sign In <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <p style="text-align:center; font-size:0.85rem; color:#64748b; margin-top:1.5rem;">
      Don't have an account? <a href="/register" style="color:#2563eb; font-weight:600;">Create Account</a>
    </p>
  </div>
</div>
{% endblock %}
